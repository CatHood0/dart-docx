name: docx 
description: "Easily generate .docx files with Dart Objects"
version: 1.0.0
homepage: https://github.com/Flutter-Document-Kit/dart-docx-toolkit
documentation: https://github.com/Flutter-Document-Kit/dart-docx-toolkit
issue_tracker: https://github.com/Flutter-Document-Kit/dart-docx-toolkit/issues

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  archive: ^4.0.7
  dart_quill_delta: ^10.8.3
  xml: ^6.6.1
  meta: ^1.15.0
  # flutter_quill_delta_easy_parser: ^1.1.8 
  image_size_getter: ^2.4.1
  uuid: ^4.5.2
  logger: ^2.6.2
  logging: ^1.3.0

dev_dependencies:
  test: ^1.20.0
  lints: ^6.0.0
